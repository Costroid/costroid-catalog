name: release

# Publishes one release of the sheets from a tag vX.Y.Z. SHA256SUMS names each sheet of sheets/X.Y.Z by
# its SHA-256. It is signed with cosign, keyless, under this workflow's identity, and the signature is
# verified against that identity before the release is published with the sheets, SHA256SUMS and its
# Sigstore bundle. This workflow never runs on a pull request.

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        name: Read the release version from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a tag vX.Y.Z"
            exit 1
          fi
          echo "version=${TAG#v}" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: node scripts/validate.mjs
      - run: npm test
      - name: Write SHA256SUMS beside a copy of the sheets
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          mkdir dist
          node scripts/manifest.mjs --version "$VERSION" --out dist/SHA256SUMS
          cp "sheets/$VERSION"/*.json dist/
          cd dist
          sha256sum --check --strict SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign SHA256SUMS and verify the signature against this workflow's identity
        working-directory: dist
        run: |
          # An upload to Rekor that times out can still write its entry, and cosign's own retry of that
          # upload then fails with 409. Each call signs again with a new key and certificate, so a retry
          # writes an entry of its own.
          for attempt in 1 2 3; do
            if cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS; then
              break
            fi
            if [[ $attempt == 3 ]]; then
              exit 1
            fi
            echo "::warning::attempt $attempt of 3 failed"
            sleep $((attempt * 30))
          done
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.sign.outputs.version }}
        run: |
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file "reports/$VERSION-diff.md"
